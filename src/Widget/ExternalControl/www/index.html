<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>Flow</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="assets/vendor/index.css" rel="stylesheet"/>
  <link href="assets/ns-compat.css" rel="stylesheet"/>
  <link href="assets/ns-tokens.css" rel="stylesheet"/>
  <link href="assets/ns-ui.css" rel="stylesheet"/>
  <link href="assets/style.css" rel="stylesheet"/>
  <style>
    body { font-family: var(--ns-font, "Segoe UI", Arial, sans-serif); margin: 0; color: var(--ns-text, #1e293b); }
    h1 { color: #2b6cb0; margin-bottom: 12px; }
    .app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .app-body { flex: 1; min-height: 0; display: flex; flex-direction: row; overflow: hidden; width: 100%; }
    .main-area { flex: 1; padding: 0; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }

    .sidebar-left { display: none !important; }
    .sidebar-right {
      width: 320px;
      min-width: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      background: #fff;
      border-left: 1px solid #e1e4e8;
      position: relative;
    }
    .sidebar-right.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
    .sidebar-right::-webkit-scrollbar { width: 5px; }
    .sidebar-right::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
    .sidebar-right::-webkit-scrollbar-track { background: transparent; }
    .sidebar-right .btn-icon { display:inline-flex; align-items:center; margin-right:6px; }
    .sidebar-right .btn-icon svg { width:14px; height:14px; stroke: currentColor; fill: none; stroke-width:2; }
    /* Unified right sidebar styles */
    .sidebar-right .sidebar-section-header { font-weight: 600; font-size: 13px; color: #334155; background: #f8fafc; border-bottom: 1px solid #e1e4e8; padding: 6px 8px; border-radius: 8px 8px 0 0; }
    .sidebar-right .sidebar-section-content { background: #ffffff; border: 1px solid #e1e4e8; border-top: none; border-radius: 0 0 8px 8px; padding: 8px; }
    .sidebar-right .btn { border-radius: 6px; font-size: 12px; }
    .sidebar-right input[type="text"], .sidebar-right input[type="number"], .sidebar-right select { width: 100%; height: 30px; padding: 4px 8px; border: 1px solid #dfe7ef; border-radius: 6px; font-size: 13px; }
    .sidebar-right .prop-label { font-size: 12px; color: #64748b; font-weight: 500; }
    .sidebar-right .prop-value { font-size: 13px; color: #334155; }

    .gutter.gutter-horizontal {
      position: relative;
      background: rgba(203,213,225,0.45);
      flex-shrink: 0;
    }
    .gutter.gutter-horizontal:hover { background: rgba(148,163,184,0.55); }
    .gutter.gutter-horizontal .gutter-handle {
      position: absolute;
      left: 0; right: 0; top: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gutter.gutter-horizontal .gutter-handle::before {
      content: '';
      width: 2px;
      height: 28px;
      background: #94a3b8;
      border-radius: 1px;
    }

    .sidebar-section { padding: 12px; }
    .sidebar-section + .sidebar-section { border-top: 1px solid #e1e4e8; }
    .sidebar-right .sidebar-section {
      min-width: 0;
      max-width: 100%;
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
    }
    .toolbar { margin-bottom: 8px; }
    .grid-stack-item-content { background: transparent; border: none; border-radius: 0; padding: 0; box-shadow: none; }

    .widget-content-wrapper .el-input-number__decrease,
    .widget-content-wrapper .el-input-number__increase {
      background: transparent !important;
      opacity: 0.65;
    }
    .widget-content-wrapper .el-input-number__decrease:hover,
    .widget-content-wrapper .el-input-number__increase:hover {
      background: transparent !important;
      opacity: 0.9;
    }

    .widget-content-wrapper { height: 100%; width: 100%; }
    .widget-mount { height: 100%; width: 100%; }
    .widget-mount > * { width: 100%; height: 100%; }
    .widget-mount .el-input,
    .widget-mount .el-input-number,
    .widget-mount .el-slider,
    .widget-mount .el-switch,
    .widget-mount .el-checkbox { width: 100%; height: 100%; }
    .widget-mount .el-input__wrapper { height: 100%; box-sizing: border-box; }
    .widget-mount .el-input__inner { height: 100%; }

    .canvas-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
    .edit-mode .canvas-viewport { cursor: grab; }
    .pixel-canvas { position: relative; background: #f8fafc; transform-origin: 0 0; will-change: transform; }
    .pixel-canvas .grid-stack-item { position: absolute; z-index: 2; }
    .pixel-canvas .grid-stack-item.ns-frame { z-index: 0; }
    .pixel-canvas.ns-drop-over { outline: 2px dashed rgba(43,108,176,0.75); outline-offset: -2px; box-shadow: inset 0 0 0 2px rgba(43,108,176,0.08); }
    .ns-marquee-select { position: absolute; z-index: 50; border: 1px solid rgba(43,108,176,0.9); background: rgba(43,108,176,0.12); pointer-events: none; box-sizing: border-box; }

    .px-resize-handle { display: none; position: absolute; width: 12px; height: 12px; background: rgba(37,99,235,0.95); border: 2px solid #ffffff; border-radius: 3px; z-index: 20; }
    .edit-mode .grid-selected .px-resize-handle { display: block; }
    .edit-mode .grid-stack-item:hover .px-resize-handle { display: block; }
    .px-resize-handle[data-dir="nw"] { left: -6px; top: -6px; cursor: nwse-resize; }
    .px-resize-handle[data-dir="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
    .px-resize-handle[data-dir="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .px-resize-handle[data-dir="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
    .widget-title { font-weight: 600; font-size: 13px; color: #475569; margin-bottom: 8px; cursor: move; }
    .view-mode .widget-title { cursor: default; }
    .view-mode .grid-stack-item-content { border-color: transparent; box-shadow: none; background: transparent; }
    .view-mode .sidebar-right, .view-mode .gutter { display: none !important; }
    .grid-selected .grid-stack-item-content { box-shadow: 0 0 0 2px rgba(43,108,176,0.15); }

    .grid-stack-item[data-group-id] .grid-stack-item-content { outline: none; }

    .group-indicator { display: none; position: absolute; border: 2px dashed rgba(16,185,129,0.75); border-radius: 10px; background: rgba(16,185,129,0.04); pointer-events: none; z-index: 1; }
    .edit-mode .group-indicator { display: block; pointer-events: none; cursor: default; }
    .view-mode .group-indicator { display: none; }
    .group-indicator.group-selected { border-color: rgba(43,108,176,0.85); background: rgba(43,108,176,0.04); }
    
    /* 编辑模式下显示遮罩层 */
    .widget-overlay-mask { display: none; }
    .edit-mode .widget-overlay-mask { display: block; cursor: move; border: 1px dashed rgba(0,0,0,0.1); }
    .edit-mode .grid-selected .widget-overlay-mask { border: 2px solid #2b6cb0; background: rgba(43,108,176,0.05); }
    /* 视图模式下确保内容可交互 */
    .view-mode .grid-stack-item-content { pointer-events: auto; }
    /* 移动端拖拽/滚动优化：默认允许纵向滚动；编辑模式禁用滚动以专注拖拽 */
    .main-area { overscroll-behavior: contain; }
    .view-mode .main-area, .view-mode .pixel-canvas { touch-action: pan-y; }
    .edit-mode .main-area, .edit-mode .pixel-canvas { touch-action: none; }
    /* 拖拽手柄不拦截事件，遮罩只在编辑模式参与命中 */
    .widget-drag-handle { pointer-events: none; }
    .view-mode .widget-overlay-mask { pointer-events: none; }
    .edit-mode .widget-overlay-mask { pointer-events: auto; touch-action: none; }
    .edit-mode .grid-stack-item.ns-widget-interact .widget-overlay-mask { pointer-events: none; border: none; background: transparent; }
    .edit-mode .grid-stack-item.ns-widget-interact .px-resize-handle { display: none !important; }
    .px-resize-handle { touch-action: none; }

    .prop-label { font-size: 12px; color: #64748b; }
    .prop-value { font-size: 13px; }

    /* 颜色选择器 teleport 到 body，避免被侧栏 overflow 裁切 */
    .ns-color-popper.el-popper { z-index: 4000 !important; }

    /* 编辑操作已移至右键菜单 */

    .ns-context-menu {
      position: fixed;
      z-index: 5000;
      min-width: 168px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
    }
    .ns-context-menu-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #334155;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .ns-context-menu-item:hover:not(:disabled) { background: #f1f5f9; color: #1e293b; }
    .ns-context-menu-item:disabled,
    .ns-context-menu-item.disabled { color: #94a3b8; cursor: default; }
    .ns-context-menu-sep {
      height: 1px;
      margin: 4px 6px;
      background: #e2e8f0;
    }

    /* 侧边栏折叠样式 */
    .sidebar-section-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; -webkit-user-select: none; user-select: none; }
    .sidebar-section-header:hover { color: #2b6cb0; }
    .sidebar-section-content { transition: max-height 0.3s ease, opacity 0.3s ease; overflow: hidden; max-height: 3000px; opacity: 1; }
    .sidebar-section.collapsed .sidebar-section-content { max-height: 0; opacity: 0; padding: 0 !important; margin: 0 !important; }
    .toggle-icon { transition: transform 0.3s ease; }
    .sidebar-section.collapsed .toggle-icon { transform: rotate(-90deg); }
    #tabsBar { overflow: visible; }
    .top-nav {
      height: var(--ns-nav-height, 56px);
      background: var(--ns-nav-bg, #3d4650);
      color: var(--ns-nav-text, #f8fafc);
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 10px 0 8px;
      border-bottom: 1px solid var(--ns-nav-border, rgba(255,255,255,0.12));
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      height: 100%;
    }
    .top-nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 0 12px 0 6px;
      margin-right: 4px;
      -webkit-user-select: none;
      user-select: none;
    }
    .top-nav-brand-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .top-nav-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      min-width: 0;
    }
    .top-nav-brand-name {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.01em;
      color: #fff;
    }
    .top-nav-brand-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.48);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .top-nav-divider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.14);
      margin: 0 6px 0 2px;
      flex-shrink: 0;
    }
    .top-nav-center {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      height: 100%;
      padding-left: 2px;
    }
    .top-nav #tabsList {
      display: flex;
      flex-wrap: nowrap !important;
      gap: 2px;
      align-items: stretch;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      min-width: 0;
      padding: 0;
      margin: 0;
      border-bottom: none;
      scrollbar-width: none;
    }
    .top-nav #tabsList::-webkit-scrollbar { display: none; }
    .top-nav #tabsList .nav-link {
      background: transparent !important;
      border: none !important;
      color: rgba(255,255,255,0.72);
      padding: 0 14px;
      height: 56px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      position: relative;
    }
    .top-nav #tabsList .nav-link:hover { color: #ffffff; background: rgba(255,255,255,0.06) !important; }
    .top-nav #tabsList .nav-link.active {
      color: #ffffff;
      font-weight: 600;
    }
    .top-nav #tabsList .nav-link.active::after {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: #f59e0b;
    }
    .top-nav .tab-close { color: rgba(255,255,255,0.45); font-size: 14px; }
    .top-nav .tab-close:hover { color: #fca5a5; }
    .top-nav .top-nav-add {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      color: rgba(255,255,255,0.78);
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }
    .top-nav .top-nav-add:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.28);
    }
    .top-nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
      padding-left: 10px;
      height: 100%;
    }
    .top-nav-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding-left: 4px;
      border-left: 1px solid rgba(255,255,255,0.12);
      margin-left: 2px;
    }
    .ns-nav-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255,255,255,0.82);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .ns-nav-icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .ns-nav-icon-btn svg[data-filled] circle,
    .ns-nav-icon-btn svg.ns-icon-dots circle {
      fill: currentColor;
      stroke: none;
    }
    #toggleFullscreen .ns-fs-exit { display: none; }
    #toggleFullscreen[data-fs="1"] .ns-fs-enter { display: none; }
    #toggleFullscreen[data-fs="1"] .ns-fs-exit { display: block; }
    .ns-nav-icon-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .ns-nav-icon-btn:focus-visible {
      outline: 2px solid rgba(245,158,11,0.55);
      outline-offset: 1px;
    }
    .ns-nav-icon-btn.is-icon-only { padding: 0; width: 32px; }
    .ns-nav-edit-btn[data-editing="0"] {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.14);
    }
    .ns-nav-edit-btn[data-editing="1"] {
      color: #fff7ed;
      background: rgba(245, 158, 11, 0.28);
      border-color: rgba(245, 158, 11, 0.45);
    }
    .ns-nav-edit-btn[data-editing="1"]:hover {
      background: rgba(245, 158, 11, 0.4);
    }
    .top-nav .dropdown { position: relative; }
    .top-nav .dropdown-menu {
      margin-top: 6px;
      right: 0 !important;
      left: auto !important;
      top: 100% !important;
      transform: none !important;
      border-radius: 10px;
      min-width: 180px;
      padding: 6px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.10);
      z-index: 1060;
    }
    .top-nav .dropdown-menu .dropdown-item {
      border-radius: 8px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .top-nav .dropdown-menu .dropdown-item svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      opacity: 0.75;
    }
    .ns-edit-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 14px;
      font-size: 12px;
      color: #78350f;
      background: linear-gradient(90deg, #fef3c7 0%, #fde68a 100%);
      border-bottom: 1px solid rgba(245, 158, 11, 0.35);
      z-index: 25;
    }
    .ns-edit-banner[data-visible="1"] { display: flex; }
    .ns-edit-banner-text { font-weight: 500; }
    .ns-edit-banner-done {
      height: 28px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid rgba(146, 64, 14, 0.25);
      background: #fff;
      color: #92400e;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .ns-edit-banner-done:hover { background: #fffbeb; }
    .main-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px; }
    #tabsContent { position: relative; height: 100%; }

    @media (max-width: 900px) {
      .top-nav-brand-text { display: none; }
      .ns-nav-btn-label { display: none; }
      .ns-nav-edit-btn { display: none !important; }
      .ns-edit-banner { display: none !important; }
      .sidebar-right { display: none !important; }
    }
    @media (max-width: 640px) {
      .top-nav-divider { display: none; }
      .ns-mode-badge .ns-mode-badge-label { display: none; }
      .ns-mode-badge { width: 26px; padding: 0; justify-content: center; }
      .ns-mode-badge::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
    }
    #tabsList { display: flex; flex-wrap: nowrap !important; gap: 6px; }
    #tabsList .nav-link { white-space: nowrap; display: inline-flex; align-items: center; }
    .tab-close { cursor: pointer; margin-left: 6px; line-height: 1; }
    .tab-close:hover { color: #dc3545; }

    .widget-thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; align-content: start; }
    .sidebar-right .widget-thumb-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .widget-thumb { height: 50px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1px solid #e1e4e8; border-radius: 10px; background: #ffffff; color: #334155; cursor: pointer; -webkit-user-select: none; user-select: none; min-width: 0; }
    .sidebar-right .widget-thumb {
      height: auto;
      min-height: 48px;
      padding: 6px 4px;
      gap: 4px;
    }
    .widget-thumb:hover { border-color: #2b6cb0; box-shadow: 0 0 0 2px rgba(43,108,176,0.12); }
    .widget-thumb:active { transform: translateY(1px); }
    .widget-thumb:focus-visible { outline: 2px solid rgba(43,108,176,0.45); outline-offset: 2px; }
    .widget-thumb-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .widget-thumb-icon svg { width: 24px; height: 24px; stroke: #64748b; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .widget-thumb-label { font-size: 11px; line-height: 1.1; text-align: center; color: #475569; }
    .sidebar-right .widget-thumb-label {
      font-size: 10px;
      line-height: 1.15;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }
    .sidebar-right .sidebar-section-content { overflow: hidden; }

    .ws-status-bar {
      display: none;
      position: relative;
      z-index: var(--ns-z-status, 20);
      padding: 6px 12px;
      font-size: 12px;
      text-align: center;
      color: #fff;
      background: #b45309;
    }
    .ws-status-bar.ws-status-visible { display: block; }
    .ws-status-bar[data-level="error"] { background: #b91c1c; }
    .ws-status-bar[data-level="warn"] { background: #b45309; }
  </style>
</head>
<body class="view-mode">
  <div id="nsBootSkeleton" class="ns-boot-skeleton" aria-busy="true" aria-label="正在加载仪表盘">
    <div class="ns-boot-skeleton-nav"></div>
    <div class="ns-boot-skeleton-body">
      <div class="ns-boot-skeleton-canvas"></div>
    </div>
  </div>
  <div class="app-shell">
    <div id="tabsBar" class="top-nav" role="banner">
      <div class="top-nav-left">
        <div class="top-nav-brand" title="Flow">
          <img src="favicon.png" alt="" class="top-nav-brand-img" />
          <div class="top-nav-brand-text">
            <span class="top-nav-brand-name">Flow</span>
            <span class="top-nav-brand-sub">Remote</span>
          </div>
        </div>
        <div class="top-nav-divider" aria-hidden="true"></div>
      </div>
      <div class="top-nav-center">
        <div id="tabsList" class="nav" role="tablist"></div>
        <button id="sidebarAddTab" type="button" class="top-nav-add" title="新增页面" aria-label="新增页面">+</button>
      </div>
      <div class="top-nav-right">
