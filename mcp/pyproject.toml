[project]
name = "flow-mcp"
version = "0.1.0"
description = "MCP server for Flow node-graph editor: AI builds node graphs via natural language"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
flow-mcp = "flow_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flow_mcp*"]
